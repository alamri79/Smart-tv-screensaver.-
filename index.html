<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شاشة أبوظبي الذكية</title>
<style>
:root{color-scheme:dark;--bg:#090f16;--panel:#111d29;--line:#253744;--gold:#d4bb82;--text:#e7ebea;--muted:#9aaab2}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 25% 15%,#172630 0%,var(--bg) 65%);color:var(--text);overflow:hidden}.screen{height:100dvh;min-height:530px;padding:clamp(18px,3vw,54px);display:flex;flex-direction:column;gap:clamp(12px,2vh,25px);position:relative}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 30%,#ffffff03 50%,transparent 70%)}header,.hero,.prayers,.shortcuts,footer{position:relative;z-index:1}header{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:clamp(17px,1.6vw,26px);letter-spacing:.03em;color:var(--gold)}.place{color:var(--muted);font-size:clamp(12px,1vw,17px)}.hero{display:flex;justify-content:space-between;align-items:center;gap:30px;flex:1;min-height:0}.clock{font-size:clamp(70px,10vw,185px);line-height:1;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.06em;white-space:nowrap;direction:ltr}.seconds{font-size:.32em;letter-spacing:0;color:var(--gold);vertical-align:baseline}.ampm{font-size:clamp(16px,1.7vw,28px);color:var(--muted);margin-top:10px}.dates{display:flex;flex-direction:column;gap:12px;text-align:left;color:#c6d0d1;font-size:clamp(15px,1.6vw,27px)}.dates .hijri{color:var(--gold)}.section-title{font-size:clamp(15px,1.3vw,21px);color:#b7c7c8;margin:0 0 10px}.prayer-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.prayer{background:#101c27c9;border:1px solid var(--line);border-radius:17px;padding:clamp(12px,1.4vw,24px);text-align:center;min-width:0}.prayer.active{border-color:#a88c54;background:#26302e;box-shadow:0 0 24px #a88c5418}.prayer .name{color:#afbec4;font-size:clamp(13px,1.2vw,20px)}.prayer .time{font-size:clamp(19px,2vw,34px);font-variant-numeric:tabular-nums;margin-top:12px;direction:ltr}.prayer.active .name,.prayer.active .time{color:#e6c88a}.next{color:var(--gold);font-size:clamp(12px,1vw,17px);margin-top:12px;min-height:20px}.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{appearance:none;border:1px solid #34434b;border-radius:18px;background:linear-gradient(135deg,#1b2b35,#121d28);color:var(--text);text-align:right;padding:clamp(15px,1.7vw,26px);cursor:pointer;min-height:105px;transition:transform .2s,border-color .2s,background .2s;font-family:inherit}.tile:hover,.tile:focus-visible{outline:none;transform:translateY(-4px);border-color:var(--gold);background:#27343b}.tile .glyph{font-size:clamp(22px,2vw,35px);color:var(--gold)}.tile strong{display:block;font-size:clamp(15px,1.3vw,23px);margin-top:7px}.tile small{display:block;color:var(--muted);font-size:clamp(11px,.9vw,15px);margin-top:5px}footer{display:flex;justify-content:space-between;gap:12px;color:#7f939e;font-size:clamp(11px,.85vw,15px)}.dialog{position:fixed;inset:0;z-index:5;background:#03070bdf;display:none;align-items:center;justify-content:center;padding:30px}.dialog.open{display:flex}.dialog-box{background:#14212b;border:1px solid #657064;border-radius:20px;width:min(760px,100%);max-height:80vh;overflow:auto;padding:30px;line-height:2}.dialog-box h2{color:var(--gold);margin-top:0}.close{background:#34414a;color:white;border:1px solid #64717a;border-radius:10px;padding:9px 18px;font-size:18px;cursor:pointer}.dialog-box p{white-space:pre-line}body.shift .screen{transform:translate(5px,3px)}.screen{transition:transform 15s linear}@media(max-width:850px){body{overflow:auto}.screen{min-height:100dvh;height:auto}.hero{flex-direction:column;align-items:flex-start}.dates{text-align:right}.clock{font-size:clamp(60px,12vw,100px)}.prayer-grid{grid-template-columns:repeat(3,1fr)}.shortcuts{grid-template-columns:repeat(2,1fr)}}@media(max-height:680px) and (min-width:851px){.screen{gap:8px;padding:20px 35px}.clock{font-size:clamp(70px,8vw,120px)}.prayer{padding:10px}.tile{min-height:85px;padding:12px}.hero{gap:15px}.prayer .time{margin-top:6px}.next{margin-top:6px}}
</style>
</head>
<body>
<main class="screen" id="screen"><header><div class="brand">✦ سكينة | شاشة المنزل</div><div class="place">أبوظبي، الإمارات العربية المتحدة <span id="status"></span></div></header>
<section class="hero"><div><div class="clock" aria-label="الوقت"><span id="hm">--:--</span><span class="seconds" id="sec">:--</span></div><div class="ampm" id="ampm">—</div></div><div class="dates"><div id="greg">—</div><div class="hijri" id="hijri">—</div></div></section>
<section><h2 class="section-title">مواقيت الصلاة <span id="countdown" style="float:left;color:var(--gold)"></span></h2><div class="prayer-grid" id="prayers"></div><div class="next" id="note">المواقيت حسابية تقريبية لأبوظبي؛ تحقق من المصدر الرسمي.</div></section>
<section><h2 class="section-title">المكتبة الروحانية</h2><div class="shortcuts"><button class="tile" data-key="kahf"><span class="glyph">۞</span><strong>سورة الكهف</strong><small>قراءة • الجمعة</small></button><button class="tile" data-key="baqarah"><span class="glyph">۞</span><strong>سورة البقرة</strong><small>قراءة • القرآن الكريم</small></button><button class="tile" data-key="morning"><span class="glyph">☼</span><strong>أذكار الصباح</strong><small>أذكار مختارة</small></button><button class="tile" data-key="evening"><span class="glyph">☾</span><strong>أذكار المساء</strong><small>أذكار مختارة</small></button></div></section>
<footer><span>اضغط OK أو Enter لفتح البطاقة • رجوع أو Escape للإغلاق</span><span>توقيت الإمارات UTC+4 • دون اتصال بالإنترنت</span></footer></main>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-box"><button class="close" id="close">إغلاق ×</button><h2 id="dialog-title"></h2><p id="dialog-content"></p></div></div>
<script>
(function(){'use strict';
var TZ='Asia/Dubai',LAT=24.4539,LON=54.3773;var names=['الفجر','الشروق','الظهر','العصر','المغرب','العشاء'];var ids=['fajr','sunrise','dhuhr','asr','maghrib','isha'];var timings=[],lastDay='',lastFocus=null;
function el(id){return document.getElementById(id)}
function fmt(date,options){try{return new Intl.DateTimeFormat('ar-AE',Object.assign({timeZone:TZ},options)).format(date)}catch(e){return 'غير متاح'}}
function dubaiParts(d){var s=new Date(d.getTime()+4*3600000);return {y:s.getUTCFullYear(),m:s.getUTCMonth()+1,day:s.getUTCDate(),h:s.getUTCHours(),min:s.getUTCMinutes(),sec:s.getUTCSeconds()}}
function rad(x){return x*Math.PI/180}function deg(x){return x*180/Math.PI}function sin(x){return Math.sin(rad(x))}function cos(x){return Math.cos(rad(x))}function tan(x){return Math.tan(rad(x))}function asin(x){return deg(Math.asin(Math.max(-1,Math.min(1,x))))}function acos(x){return deg(Math.acos(Math.max(-1,Math.min(1,x))))}function atan2(y,x){return deg(Math.atan2(y,x))}function mod(a,b){return (a%b+b)%b}
// NOAA-style solar coordinates, numerical solar altitude crossing; prayer angles are configurable.
function julian(y,m,d){if(m<=2){y--;m+=12}var a=Math.floor(y/100),b=2-a+Math.floor(a/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5}
function solar(jd){var T=(jd-2451545)/36525,L0=mod(280.46646+T*(36000.76983+.0003032*T),360),M=357.52911+T*(35999.05029-.0001537*T),e=.016708634-T*(.000042037+.0000001267*T);var C=sin(M)*(1.914602-T*(.004817+.000014*T))+sin(2*M)*(.019993-.000101*T)+sin(3*M)*.000289;var trueL=L0+C,omega=125.04-1934.136*T,lambda=trueL-.00569-.00478*sin(omega),eps0=23+(26+(21.448-T*(46.815+T*(.00059-T*.001813)))/60)/60,eps=eps0+.00256*cos(omega);var decl=asin(sin(eps)*sin(lambda)),yv=Math.pow(tan(eps/2),2);var eq=4*deg(yv*Math.sin(2*rad(L0))-2*e*Math.sin(rad(M))+4*e*yv*Math.sin(rad(M))*Math.cos(2*rad(L0))-.5*yv*yv*Math.sin(4*rad(L0))-1.25*e*e*Math.sin(2*rad(M)));return {decl:decl,eq:eq}}
function hourAngle(alt,decl){return acos((sin(alt)-sin(LAT)*sin(decl))/(cos(LAT)*cos(decl)))/15}
function compute(y,m,d){var jd=julian(y,m,d),sol=solar(jd+.5),noon=12+(4*LON-sol.eq)/-60+4; // equivalent to 12 + (timezone*60 - 4*longitude - equationOfTime)/60
noon=12+(240-4*LON-sol.eq)/60;
var rise=hourAngle(-.833,sol.decl),fajr=hourAngle(-18.2,sol.decl),isha=hourAngle(-18.2,sol.decl);var asrAlt=deg(Math.atan(1/(1+tan(Math.abs(LAT-sol.decl))))),asr=hourAngle(asrAlt,sol.decl);
return [noon-fajr,noon-rise,noon,noon+asr,noon+rise,noon+isha].map(function(v){return Math.round(v*60)})}
function clockTime(min){var h=mod(Math.floor(min/60),24),m=mod(min,60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function drawPrayer(){el('prayers').innerHTML=names.map(function(n,i){return '<div class="prayer" id="p'+i+'"><div class="name">'+n+'</div><div class="time">'+clockTime(timings[i])+'</div></div>'}).join('')}
function update(){var now=new Date(),p=dubaiParts(now),key=p.y+'-'+p.m+'-'+p.day;if(key!==lastDay){lastDay=key;timings=compute(p.y,p.m,p.day);drawPrayer();el('greg').textContent=fmt(now,{weekday:'long',day:'numeric',month:'long',year:'numeric'});try{el('hijri').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{timeZone:TZ,day:'numeric',month:'long',year:'numeric'}).format(now)+' هـ'}catch(e){el('hijri').textContent='التاريخ الهجري غير مدعوم في هذا المتصفح'}}var h12=p.h%12||12;el('hm').textContent=String(h12).padStart(2,'0')+':'+String(p.min).padStart(2,'0');el('sec').textContent=':'+String(p.sec).padStart(2,'0');el('ampm').textContent=p.h<12?'صباحاً':'مساءً';var current=p.h*60+p.min+p.sec/60,next=timings.findIndex(function(t,i){return i!==1&&t>current});var nextTime,nextName;if(next<0){next=0;var tomorrow=new Date(Date.UTC(p.y,p.m-1,p.day+1)),tp=compute(tomorrow.getUTCFullYear(),tomorrow.getUTCMonth()+1,tomorrow.getUTCDate());nextTime=1440+tp[0];nextName='الفجر'}else{nextTime=timings[next];nextName=names[next]}var remaining=Math.max(0,Math.ceil((nextTime-current)*60)),hh=Math.floor(remaining/3600),mm=Math.floor(remaining%3600/60),ss=remaining%60;el('countdown').textContent='القادمة: '+nextName+' خلال '+[hh,mm,ss].map(function(x){return String(x).padStart(2,'0')}).join(':');document.querySelectorAll('.prayer').forEach(function(node,i){node.classList.toggle('active',i===next)});}
var content={kahf:['سورة الكهف','سورة الكهف (110 آيات). لا يتضمن هذا الملف النص القرآني الكامل منعاً لعرض نص غير مدقَّق. يمكن إضافة نص موثوق مُراجع داخل الملف لتصبح القراءة متاحة دون إنترنت.'],baqarah:['سورة البقرة','سورة البقرة (286 آية). هذه بطاقة تمهيدية، وليست مشغلاً صوتياً أو نسخة كاملة من المصحف. أضف نصاً قرآنياً موثقاً بعد مراجعته.'],morning:['أذكار الصباح','آية الكرسي (البقرة: 255)\nسورة الإخلاص والمعوذتان (ثلاث مرات)\n«أصبحنا وأصبح الملك لله، والحمد لله...»\nهذه قائمة تذكيرية مختصرة، وليست نصوص الأذكار الكاملة.'],evening:['أذكار المساء','آية الكرسي (البقرة: 255)\nسورة الإخلاص والمعوذتان (ثلاث مرات)\n«أمسينا وأمسى الملك لله، والحمد لله...»\nهذه قائمة تذكيرية مختصرة، وليست نصوص الأذكار الكاملة.']};
function close(){el('dialog').classList.remove('open');if(lastFocus)lastFocus.focus()};document.querySelectorAll('.tile').forEach(function(b){b.addEventListener('click',function(){lastFocus=b;var c=content[b.dataset.key];el('dialog-title').textContent=c[0];el('dialog-content').textContent=c[1];el('dialog').classList.add('open');el('close').focus()})});el('close').addEventListener('click',close);document.addEventListener('keydown',function(e){if((e.key==='Escape'||e.key==='Backspace')&&el('dialog').classList.contains('open')){e.preventDefault();close()}if(el('dialog').classList.contains('open'))return;var buttons=Array.prototype.slice.call(document.querySelectorAll('.tile')),idx=buttons.indexOf(document.activeElement);if(['ArrowLeft','ArrowRight'].includes(e.key)&&idx>=0){e.preventDefault();buttons[mod(idx+(e.key==='ArrowLeft'?1:-1),buttons.length)].focus()}});
update();setInterval(update,1000);setInterval(function(){document.body.classList.toggle('shift')},90000);
})();
</script>
</body></html>
